services:
  # ============================================================================
  # TruckOps Backend Web Service (Docker on Render)
  # ============================================================================
  - type: web
    name: truckops-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /up
    autoDeploy: true

    envVars:
      - key: APP_NAME
        value: TruckOps
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: truckops-backend
          property: host
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info

      # Database Configuration
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # Lifecycle Deployment Flags
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SEED_DATABASE
        value: "true"

      # Allowed CORS Origins
      - key: FRONTEND_URL
        value: "http://localhost:3000"
